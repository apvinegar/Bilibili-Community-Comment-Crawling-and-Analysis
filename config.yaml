# --- LLM 分析设置 ---
llm:
  # API地址 (OpenAI兼容接口: DeepSeek, Qwen, OpenAI等)
  api_base: "https://api.deepseek.com/v1"
  api_key: "${DEEPSEEK_API_KEY}"
  model: "deepseek-chat"
  # 每次LLM调用处理的文本数
  batch_size: 50
  # 最大并发API调用数
  max_concurrent: 5
  # 温度参数 (低温度保证评分一致性)
  temperature: 0.1
  max_tokens: 200
  # 启用结果缓存 (按内容MD5)
  cache_enabled: true
  # 启用规则预过滤 (高频弹幕模式不需要LLM)
  rule_prefilter: true

# --- CFI 评分权重 ---
scoring:
  weights:
    toxicity_inverse: 0.25
    friendliness: 0.25
    constructiveness: 0.15
    sentiment_centered: 0.15
    controversy_penalty: 0.10
    quality_bonus: 0.05
    nontoxic_bonus: 0.05
  # 公式版本号，变更权重时递增
  version: "1.0"
  # 高毒性阈值
  toxicity_threshold: 70
  # 高质量阈值
  constructiveness_threshold: 70
  # 正面情感阈值
  sentiment_threshold: 60

# --- 数据库 ---
database:
  path: "data/bcfc.db"
  wal_mode: true

# --- 日志 ---
logging:
  level: "INFO"
  file: "logs/bcfc.log"
  # 日志格式
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
