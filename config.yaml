# =============================================================================
# BCFC — Bilibili Community Friendliness Crawler 配置文件
# =============================================================================

# --- B站认证 ---
bilibili:
  sessdata: "${BILIBILI_SESSDATA}"
  bili_jct: "${BILIBILI_BILI_JCT}"
  buvid3: "${BILIBILI_BUVID3}"
  # B站用户UID，用于部分需要登录的接口
  dedeuserid: "${BILIBILI_DEDEUSERID}"
  # WBI密钥刷新间隔（秒），通常1-2小时自动刷新
  wbi_refresh_interval: 3600

# --- 爬取设置 ---
crawler:
  # 请求间隔（秒），避免触发反爬
  request_delay: 0.5
  # 最大重试次数
  max_retries: 3
  # 重试退避基数（秒）：5, 15, 45...
  retry_backoff_base: 5
  # 每个关键词最多搜索页数（20条/页）
  search_pages_per_keyword: 50
  # 每个视频最多获取的评论数
  max_comments_per_video: 5000
  # 每个视频最多获取的弹幕数
  max_danmaku_per_video: 10000
  # 时间范围
  date_range:
    start: "2018-01-01"
    end: "2026-12-31"
  # HTTP代理（可选），如 "socks5://127.0.0.1:1080" 或 "http://127.0.0.1:7890"
  proxy: null
  # 是否爬取历史弹幕（需要登录）
  fetch_historical_danmaku: true

