[project]
name = "bcfc"
version = "0.1.0"
description = "Bilibili Community Friendliness Crawler — 爬取B站二次元手游评论弹幕并用LLM分析社区友好度"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "protobuf>=4.25",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "openai>=1.30",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pydantic>=2.7",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = [
    "transformers>=4.40",
    "torch>=2.2",
]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.20",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
bcfc = "bcfc.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
